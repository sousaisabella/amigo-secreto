<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D62839">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; manifest-src 'self'; worker-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Amigo secreto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preload" href="fonts/nunito-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Nunito";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/nunito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/nunito-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format("woff2")}
:root{--bg:#F4F9F5;--surface:#FFFFFF;--ink:#173B2E;--muted:#587267;--line:#CBE0D3;--accent:#D62839;--accent-d:#9E1C2A;--gold:#F4B942;--flake:#BFD9CC;--ok:#1F7A4F;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F3D2E;--surface:#17503D;--ink:#FFF8EC;--muted:#B5D1C4;--line:#2F7059;--accent:#E8394B;--accent-d:#A81F2E;--flake:#FFFFFF;--ok:#8BE0AE;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F3D2E;--surface:#17503D;--ink:#FFF8EC;--muted:#B5D1C4;--line:#2F7059;--accent:#E8394B;--accent-d:#A81F2E;--flake:#FFFFFF;--ok:#8BE0AE;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle,var(--flake) 2px,transparent 2.5px),radial-gradient(circle,var(--flake) 1.2px,transparent 1.8px);background-size:97px 97px,151px 151px;background-position:0 0,40px 60px;animation:snow 30s linear infinite}
@keyframes snow{to{background-position:30px 97px,10px 211px}}
.cane{height:12px;background:repeating-linear-gradient(45deg,var(--accent) 0 14px,#fff 14px 28px)}
main{position:relative;max-width:520px;margin:0 auto;padding:24px 18px 100px}
h1,h2,.fun{font-family:"Fredoka","Nunito",system-ui,sans-serif}
h1{font-size:clamp(34px,10vw,46px);line-height:1.05;margin:0 0 8px;font-weight:700;word-break:break-word}
h2{font-size:22px;margin:30px 0 8px;font-weight:700}
p{margin:0 0 14px;color:var(--muted)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
input[type=text],input[type=url],input[type=date],textarea{width:100%;min-width:0;min-height:48px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface)}
textarea{resize:vertical}
.btn{min-height:50px;padding:0 22px;border-radius:999px;border:0;background:var(--accent);color:#fff;font:700 17px "Fredoka","Nunito",sans-serif;box-shadow:0 4px 0 var(--accent-d);flex-shrink:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-d)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%;margin-top:22px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:44px;padding:0 4px}
.err{min-height:22px;margin:6px 0 0;color:var(--accent);font-size:15px;font-weight:700}
.lab{display:block;margin-bottom:10px;color:var(--muted);font-size:15px;font-weight:700}
.lab input{display:block;width:100%;max-width:100%;margin-top:4px;font-weight:400}
ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:12px}
.card{background:var(--surface);border-radius:18px;padding:14px 14px 10px 18px;border:2px solid var(--line);border-left:10px solid var(--c)}
.card:nth-child(3n+1){--c:var(--accent)}.card:nth-child(3n+2){--c:var(--gold)}.card:nth-child(3n){--c:#2E9A6B}
.card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card .top b{font:700 20px "Fredoka",sans-serif;word-break:break-word}
.x{width:44px;height:44px;flex-shrink:0;border:0;background:none;color:var(--muted);font-size:24px;border-radius:10px}
.card details{margin-top:6px}
summary{min-height:40px;display:flex;align-items:center;color:var(--muted);font-size:15px;font-weight:700;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:16px}
.chk input{width:20px;height:20px;flex-shrink:0}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px}
.mini b{font:700 19px "Fredoka",sans-serif;word-break:break-word}
.seen{color:var(--ok);font-size:15px;font-weight:700}
.hand{font-size:15px;color:var(--muted);margin:0 0 4px;font-weight:700}
.who{font:700 clamp(38px,12vw,56px)/1.05 "Fredoka",sans-serif;margin:0 0 22px;word-break:break-word}
.tag{position:relative;background:#F6E7BD;color:#2E2208;padding:44px 28px 34px;border-radius:8px;clip-path:polygon(0 0,84% 0,100% 16%,100% 100%,0 100%);animation:drop .6s ease-out}
.tag::before{content:"";position:absolute;top:20px;right:30px;width:14px;height:14px;border-radius:50%;background:var(--bg)}
.tag small{display:block;font-size:16px;color:#6B5420;margin-bottom:6px;font-weight:700}
.tag strong{display:block;font:700 clamp(40px,13vw,60px)/1.05 "Fredoka",sans-serif;word-break:break-word}
@keyframes drop{from{transform:rotate(-6deg) translateY(-16px);opacity:0}to{transform:none;opacity:1}}
dl{margin:20px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
dt{color:var(--muted)}dd{margin:0;font-weight:700;word-break:break-word}
.wall p{margin:0 0 6px;color:var(--ink)}.wall span{color:var(--muted)}
.foot{margin-top:28px}
.hint{font-size:15px;color:var(--muted);margin:6px 0 0}
.box{background:var(--surface);border:2px dashed var(--gold);border-radius:18px;padding:14px 16px;margin:14px 0}
.box p{color:var(--ink)}
.box.warnbox{border-color:var(--accent)}
.code{font:700 26px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;color:var(--ink);margin:6px 0 10px;user-select:all;word-break:break-all}
.count{font:700 19px "Fredoka",sans-serif;color:var(--ink);margin:4px 0 12px}
.lk{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0}
.lk a,.lnk{color:var(--ink);font-weight:700;word-break:break-word}
.links{gap:4px;margin:8px 0 0}
.links li{display:flex;align-items:center;justify-content:space-between;gap:6px}
.qa{margin:10px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:15px}
.qa p{margin:0 0 2px;color:var(--ink)}
.qa .hint{margin:0 0 6px}
.qa .row{margin:4px 0 8px;flex-wrap:nowrap}
.music{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;width:56px;height:56px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:26px;line-height:1;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;justify-content:center}
.music[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-d);box-shadow:0 4px 0 var(--accent-d)}
.music:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
@media (prefers-reduced-motion:reduce){.tag,body::before{animation:none}}
</style>
</head>
<body>
<div class="cane"></div>
<main id="app"></main>
<button class="music" id="music" type="button" aria-pressed="false" aria-label="Música de fundo" title="Música de fundo">🔇</button>
<script src="app.js" defer></script>
</body>
</html>
